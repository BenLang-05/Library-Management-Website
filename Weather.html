    <h2>Stoke-on-Trent</h2> 
    <h4>Longitude: <label id="lon"></label><br>
    Latitude: <label id="lat"></label><br></h4>
      <h2>Temperature:</h2>
      <canvas id="myChart" ></canvas><br>
      <div id="button">
        <button type="button" id='Bar' >Bar</button>
        <button type="button" id='Line'>Line</button><br><br>
      </div>
    
    
       
   
    
    <script>
      //TODO: Task 1:

    

    

      var daily = JSON.parse(dailydata_stoke);
      document.getElementById('lon').innerHTML = daily.coord.lon;
      document.getElementById('lat').innerHTML = daily.coord.lat;
     
      //TODO: Task 2, 3 and 4
      var forecast = JSON.parse(forecast_stoke);
      this.dateList = forecast.list.map(list => {
        return list.dt_txt;
      });
    
      this.temperatureList = forecast.list.map(list => {
        return list.main.temp;
      });

      var tempdata = {
          labels: this.dateList,
          datasets: [
            {
              label: "Temperature", 
              backgroundColor: "#2645a7",
              borderColor: "black",
              fill: false,
              data: this.temperatureList
            }
          ]
        }
        
   
      var ctx = document.getElementById("myChart").getContext('2d');
      var myChart = new Chart(ctx, {
        type: 'line',
        data: tempdata,
        options: {
            scales: {
                yAxes: [{
                    ticks: {
                        beginAtZero: true
                    }
                }]
            }
        }});


      document.getElementById('Bar').onclick = 
      function(){
        myChart.destroy();
        myChart = new Chart(ctx, {
            type:'bar',
            data: tempdata
        });
        };
        document.getElementById('Line').onclick =function(){
            myChart.destroy();
            myChart = new Chart(ctx,{
                type:'line',
                data: tempdata
            });
        };
       
    
    </script>
