    <script>
      //TODO: Task 1:

    

    

      var daily = JSON.parse(dailydata_stoke);
      document.getElementById('lon').innerHTML = daily.coord.lon;
      document.getElementById('lat').innerHTML = daily.coord.lat;
     
      //TODO: Task 2, 3 and 4
      var forecast = JSON.parse(forecast_stoke);
      this.dateList = forecast.list.map(list => {
        return list.dt_txt;
      });
    
                
      this.humiditylist = forecast.list.map(list => {
        return list.main.humidity;
      
      });

      var humdata = {
          labels: this.dateList,
          datasets: [
            {
              label: "Humidity", 
              backgroundColor: "#2645a7",
              borderColor: "black",
              fill: false,
              data: this.humiditylist
            }
          ]
        }
      var ctx1 = document.getElementById("mySecondChart").getContext('2d');
      var mySecondChart = new Chart(ctx1, {
        type: 'line',
        data: humdata,
        options: {
            scales: {
                yAxes: [{
                    ticks: {
                        beginAtZero: true
                    }
                }]
            }
        }});
      
        document.getElementById('Bar1').onclick = 
      function(){
        mySecondChart.destroy();
        mySecondChart = new Chart(ctx1, {
            type:'bar',
            data: humdata
        });
    };
    document.getElementById('Line1').onclick =function(){
            mySecondChart.destroy();
            mySecondChart = new Chart(ctx1,{
                type:'line',
                data: humdata
            });
        };

    

    
    
    </script>
